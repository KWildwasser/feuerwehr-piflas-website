<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#CD1719">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Feuerwehr Piflas</title>
<style>
/* VOICE: die echte Vereinsseite – freundlich,klar,durchgehend Du-Form; Backend knapp wie eine App
   IDEA: das Gerätehaus-Tor – rote Kante,dunkle Halle,helle Zettelwand
   PICTURE: großes Bild-Feld in der Bühne,112-Karte,Einsatzliste mit farbigen Einsatzarten
   COLOUR and TYPE: Feuerwehrrot #CD1719 (Logo),Anthrazit #1F2328,Weiß,Papiergrau; Roboto (selbst gehostet,schmal für Überschriften)
   LAYOUT: Kopf mit Logo,112 und Menü; Seiten als Bänder; Backend mit Tab-Leiste unten; Demo-Knopf schwebt */
/*FONTFACE*/
:root{color-scheme:light;--rot:#CD1719;--rot-d:#A51214;--ink:#1F2328;--grau:#4A4F55;--g2:#5B6168;--hell:#F4F3F0;--linie:#E4E2DD;--sat:env(safe-area-inset-top);--sab:env(safe-area-inset-bottom)}
:root[data-theme=dark],:root[data-theme=light]{color-scheme:light}
*{box-sizing:border-box;min-width:0;-webkit-tap-highlight-color:transparent}
html{scroll-padding-top:84px;-webkit-text-size-adjust:100%}
body{margin:0;background:#fff;color:var(--ink);font:17px/1.55 FwText,system-ui,-apple-system,sans-serif;overflow-x:clip}
/* Lange Wörter und Adressen umbrechen statt die Seite zu verbreitern */
main,.foot,.top{overflow-wrap:anywhere}h1,h2,h3{hyphens:auto}
.btn,.chip,.tag,.bars span,.btabs a{overflow-wrap:normal}.bars span{hyphens:auto}
h1,h2,h3{font-family:FwCond,FwText,sans-serif;line-height:1.05;margin:0;text-wrap:balance}
h1{font-size:clamp(38px,8vw,64px)}
h2{font-size:clamp(28px,5vw,40px)}
h3{font-size:22px;line-height:1.15}
p{margin:0}
a{color:var(--rot-d)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--ink);outline-offset:2px}
.logo{background:var(--logo) no-repeat left center/contain;display:block}
.logo.w{filter:brightness(0) invert(1)}
.wrap{max-width:1080px;margin:0 auto;padding:0 max(20px,env(safe-area-inset-left))}
.band{padding:28px 0}
.band.g{background:var(--hell)}
.band.d{background:var(--ink);color:#fff}
.stack{display:flex;flex-direction:column;gap:14px}
.mini{font-size:13px;color:var(--g2)}
.d .mini{color:#C9CBCE}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:0 22px;border-radius:999px;border:0;background:var(--rot);color:#fff;font-weight:700;text-decoration:none;text-align:center}
.btn:hover{background:var(--rot-d);color:#fff}
.btn.o{background:transparent;border:2px solid currentColor;color:inherit}
.btn.o:hover{background:rgba(127,127,127,.12)}

.btn.dk{background:var(--ink);color:#fff}
.btn.sm{min-height:44px;padding:0 16px;font-size:15px}

.btn[disabled]{background:#B8B5AE;color:#fff;cursor:not-allowed}
.btn.o[disabled]{background:none;color:var(--ink);opacity:.4}
.row2{display:flex;flex-wrap:wrap;gap:10px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));gap:16px}

/* Kopf */
.top{position:sticky;top:0;z-index:40;background:#fff;border-bottom:4px solid var(--rot);padding-top:var(--sat)}
.top .wrap{display:flex;align-items:center;justify-content:space-between;gap:10px;min-height:64px}
.top .logo{width:150px;height:41px}
.tr{display:flex;align-items:center;gap:8px}
.n112p{background:var(--rot);color:#fff;font-weight:700;text-decoration:none;border-radius:999px;padding:0 14px;min-height:44px;display:flex;align-items:center;font-size:15px;white-space:nowrap}
.n112p:hover{color:#fff;background:var(--rot-d)}
.ib{width:44px;height:44px;border:1px solid #D9D7D2;background:#fff;border-radius:12px;display:flex;align-items:center;justify-content:center;padding:0}
.ib svg{width:22px;height:22px}
.dnav{display:none;gap:4px 18px;font-weight:600;font-size:15px}
.dnav a{color:var(--ink);text-decoration:none;padding:8px 0}
.dnav a[aria-current=page]{color:var(--rot)}
@media(min-width:960px){.dnav{display:flex}}

/* Menü */
.scrim{position:fixed;inset:0;background:rgba(20,23,26,.5);z-index:60;opacity:0;pointer-events:none;transition:opacity .2s}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(86vw,360px);background:#fff;z-index:61;transform:translateX(100%);transition:transform .25s ease;display:flex;flex-direction:column;padding:calc(12px + var(--sat)) 0 calc(16px + var(--sab));overflow-y:auto}
body.mopen .scrim{opacity:1;pointer-events:auto}
body.mopen .drawer{transform:none}
.drawer .dh{display:flex;justify-content:space-between;align-items:center;padding:0 16px 8px}
/* Menü (F-11): Login ganz oben, Gruppen mit dunkler Überschrift auf hellem Band, Seiten eingerückt mit Linie */
.drawer .dlogin{display:flex;align-items:center;padding:14px 16px;border-bottom:1px solid var(--linie)}.drawer .dlogin .btn{width:100%;min-height:52px;font-size:18px;background:#3A3F45;color:#fff;box-shadow:0 1px 2px rgba(31,35,40,.2)}.drawer .dlogin .btn:hover{background:var(--ink);color:#fff}.drawer .dlogin svg{width:20px;height:20px}
.drawer nav a{display:flex;align-items:center;min-height:50px;padding:0 22px;color:var(--ink);text-decoration:none;font-weight:600;font-size:19px}
.drawer nav .mtop a{font-weight:800;border-bottom:1px solid var(--linie)}
.drawer nav .mgr{border-bottom:1px solid var(--linie)}
.drawer nav .mg{margin:0;padding:12px 22px 10px;font:800 14px/1.2 FwText,sans-serif;letter-spacing:.08em;text-transform:uppercase;color:var(--g2);background:var(--hell);border-left:0}
.drawer nav .mgl{margin:6px 0 8px 26px;border-left:2px solid #C9C6BF}
.drawer nav .mgl a{padding-left:16px;font-weight:500;font-size:18px;min-height:46px}
.drawer nav a[aria-current=page]{color:var(--ink);font-weight:800;box-shadow:inset 4px 0 0 var(--rot);background:var(--hell)}
.drawer .foot{padding:18px 22px 0;display:flex;flex-direction:column;gap:10px}

/* Bühne */
.hero{background:var(--ink);color:#fff;padding:24px 0 30px}
.hero .wrap{display:grid;gap:18px}
@media(min-width:860px){.hero .wrap{grid-template-columns:1.1fr 1fr;align-items:center}.hero .ph{order:2}}
.ph{border-radius:16px;background:#33383E;border:1px dashed #6B7178;color:#C9CBCE;min-height:200px;display:flex;align-items:center;justify-content:center;text-align:center;padding:16px;font-size:15px}
.hero .k{color:#C9CBCE;font-weight:500;font-size:15px}
.hero p.l{color:#E3E4E6;font-size:18px}
.pic{display:block;width:100%;border-radius:16px;object-fit:cover;background:#2B3036}
.hero .pic{aspect-ratio:16/10;object-position:70% 55%}
.cap{font-size:13px;color:var(--g2);margin-top:6px}
.warnb{display:flex;gap:14px;align-items:flex-start;background:#FFF1D6;border:2px solid #E9B44C;border-radius:14px;padding:16px;color:var(--ink);text-decoration:none}
.warnb .wi{flex:none;width:30px;height:30px}.warnb .wi svg{width:30px;height:30px;color:#8A5A00}.warnb b{display:block;font-size:19px;line-height:1.25;margin-bottom:4px}.warnb .more{display:block;margin-top:8px;font-weight:700;color:var(--rot-d)}
.tip>span>b{color:#6B4500}.tip.sonder>span>b{color:var(--rot-d)}
.tip.sonder{background:#FBEAEA;border:2px solid #F1C4C4}.tip.sonder svg{color:var(--rot-d)}
.ql{flex-direction:column;gap:8px}.ql .btn{width:100%;justify-content:center}
.vh{position:absolute;width:1px;height:1px;opacity:0;overflow:hidden;clip:rect(0 0 0 0)}
.upl{position:relative;cursor:pointer;align-self:flex-start;gap:8px}.upl svg{width:20px;height:20px}
.upl:focus-within{outline:3px solid var(--rot);outline-offset:2px}
.thumbs{display:flex;flex-wrap:wrap;gap:8px}.thumbs:empty{display:none}
.th{position:relative;width:112px;height:112px;border-radius:10px;overflow:hidden;background:#E9E7E2}.th img{width:100%;height:100%;object-fit:cover;display:block}
.th .ib{position:absolute;top:0;right:0;width:44px;height:44px;min-height:44px;border:0;background:none;color:#fff;font-size:20px;line-height:1;padding:0;display:flex;align-items:center;justify-content:center}.th .ib::before{content:'';position:absolute;inset:8px;border-radius:50%;background:rgba(0,0,0,.65);z-index:-1}.th .ib{z-index:1;isolation:isolate}
.gal{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}.gal img{width:100%;aspect-ratio:4/3;object-fit:cover;border-radius:10px;display:block}
.mgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.card.mi{padding:0;overflow:hidden;display:flex;flex-direction:column;gap:0}.mi img{width:100%;aspect-ratio:4/3;object-fit:cover;display:block}
.mi .b{padding:10px;display:flex;flex-direction:column;gap:8px;flex:1}.mi small{color:var(--grau);font-size:13px;line-height:1.35;flex:1}.mi .row2{flex-direction:column;gap:6px}.mi .row2>*{width:100%;justify-content:center}
.lnk{background:none;border:0;padding:0;font:inherit;font-weight:700;color:var(--ink);text-align:left;text-decoration:underline;cursor:pointer;min-height:44px}
.hero .cap{color:#A9ADB2}
.fz{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,320px),1fr));gap:16px}
.fz .card{padding:0;overflow:hidden;gap:0}
.fz .card img{width:100%;display:block;aspect-ratio:2.7/1;object-fit:cover}
.fz .card .b{padding:14px 16px 16px;display:flex;flex-direction:column;gap:4px}
.gal{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(46%,200px),1fr));gap:10px}
.gal figure{margin:0;display:flex;flex-direction:column;gap:6px}
.gal img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:12px;display:block}
.gal figcaption{font-size:14px;font-weight:600;line-height:1.3}




.ig div{position:relative;overflow:hidden}
.ig img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;border-radius:8px;display:block}
.ig div.im{padding:0;background:none}
.nk{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr))}
.nk article{border:1px solid var(--linie);border-radius:16px;overflow:hidden;background:#fff;display:flex;flex-direction:column}
.nk article img{width:100%;aspect-ratio:16/9;object-fit:cover;display:block}
.nk article .b{padding:14px 16px 16px;display:flex;flex-direction:column;gap:6px}
.feat{display:grid;gap:16px;align-items:center;background:var(--ink);color:#fff;border-radius:18px;overflow:hidden}
.feat img{width:100%;height:100%;max-height:520px;object-fit:cover;display:block}
.feat .b{padding:4px 20px 22px;display:flex;flex-direction:column;gap:10px}
@media(min-width:760px){.feat{grid-template-columns:minmax(0,1fr) minmax(0,1.2fr)}.feat .b{padding:24px}}
.mosaic{display:grid;gap:10px;grid-template-columns:repeat(2,minmax(0,1fr))}
.mosaic button{position:relative;border:0;padding:0;border-radius:16px;overflow:hidden;background:#2B3036;color:#fff;text-align:left;aspect-ratio:1;display:block}
.mosaic button:first-child{grid-column:1/-1;aspect-ratio:16/10}
@media(min-width:760px){.mosaic{grid-template-columns:2fr 1fr 1fr}.mosaic button,.mosaic button:first-child{grid-column:auto;aspect-ratio:auto;height:320px}}
.mosaic img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.mosaic .phx{position:absolute;inset:0;display:flex;align-items:flex-start;justify-content:center;text-align:center;padding:16px 12px;color:#C9CBCE;font-size:13px;border:1px dashed #6B7178;border-radius:16px;background:linear-gradient(160deg,#3A3530,#22262B)}
.mosaic .ov{position:absolute;left:0;right:0;bottom:0;padding:40px 14px 14px;background:linear-gradient(180deg,rgba(0,0,0,0),rgba(0,0,0,.78));display:flex;flex-direction:column;gap:4px}
.mosaic .ov b{font:700 20px/1.1 FwCond,sans-serif}
.mosaic button:first-child .ov b{font-size:28px}
.mosaic .tag{align-self:flex-start}
.mit{background:var(--rot);color:#fff}
.mit .opts{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(min(100%,220px),1fr))}
.mit .opts a{display:flex;flex-direction:column;gap:2px;background:#fff;color:var(--ink);border-radius:14px;padding:14px 16px;text-decoration:none;min-height:44px}
.mit .opts a b{font-size:18px}
.mit .opts a span{color:var(--grau);font-size:15px}
.mit form{background:#fff;color:var(--ink)}
.mit .vorbei{background:rgba(0,0,0,.18);border-radius:14px;padding:14px 16px}
.t-jub{background:#F6E7C1;color:#6B4A00}
.jubrow .cal{background:#F6E7C1}
.seal{width:112px;height:112px;flex:none;border-radius:50%;background:var(--rot);color:#fff;border:5px solid #C99A2E;box-shadow:0 0 0 3px #fff inset;display:flex;flex-direction:column;align-items:center;justify-content:center;font:700 44px/0.9 FwCond,sans-serif}
.seal small{font:600 14px/1.2 FwText,sans-serif;letter-spacing:.02em}
.jub{background:#FFF4E0;border-top:4px solid #C99A2E;border-bottom:4px solid #C99A2E}
.jubg{display:flex;gap:20px;align-items:flex-start;flex-wrap:wrap}
.jubg .stack{flex:1 1 280px}
.cd{background:#fff;border:1px solid #EAD9AE;border-radius:14px;padding:12px 14px;font-size:17px}
.cd b.big{font:700 40px/1 FwCond,sans-serif;color:var(--rot);margin-right:6px}
.jubchip{display:inline-flex;align-items:center;gap:8px;align-self:flex-start;background:#C99A2E;color:#1F2328;font-weight:700;border-radius:999px;padding:6px 14px;text-decoration:none;font-size:15px}
.jubchip:hover{color:#1F2328;background:#E0B54A}
a.jubnav{color:#8A6100!important;font-weight:700}
.tl{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:12px}
.tl li{display:grid;grid-template-columns:64px minmax(0,1fr);gap:14px;background:#fff;border:1px solid var(--linie);border-radius:16px;padding:14px}
.tl li.past{opacity:.75;background:var(--hell)}
.tl li.nx{border:2px solid #C99A2E}
.tl .cal{width:64px;height:64px;background:#F6E7C1}
.chron{list-style:none;margin:0;padding:0 0 0 18px;border-left:3px solid var(--rot);display:flex;flex-direction:column;gap:14px}
.chron>li{position:relative}
.partner .card{display:flex;flex-direction:column;gap:10px}
.plink{display:flex;flex-direction:column;gap:4px;text-decoration:none;color:inherit;margin-top:8px}
.plink b{font-size:20px;color:var(--rot-d)}
.chron ul{list-style:none;padding:0!important;display:flex;flex-direction:column;gap:6px}
.chron>li::before{content:'';position:absolute;left:-26px;top:6px;width:13px;height:13px;border-radius:50%;background:var(--rot);border:3px solid #fff}
.chron b.y{font:700 24px/1 FwCond,sans-serif;display:block}
.amp{display:flex;flex-direction:column;gap:8px}
.amp>div{display:grid;grid-template-columns:28px minmax(0,1fr) auto;gap:10px;align-items:center;background:#fff;border:1px solid var(--linie);border-radius:14px;padding:12px 14px}
.dot2{width:16px;height:16px;border-radius:50%;justify-self:center}
.dot2.ok{background:#1E8E3E}.dot2.warn{background:#E3A008}.dot2.bad{background:#C5221F}
.amp small{display:block;color:var(--g2);font-size:14px}
details.help{background:#fff;border:1px solid var(--linie);border-radius:14px;padding:0 14px}
details.help summary{min-height:52px;display:flex;align-items:center;font-weight:700;cursor:pointer}
details.help ol,details.help ul{margin:0 0 14px;padding-left:20px;display:flex;flex-direction:column;gap:6px}




.k112{border:2px solid var(--rot);border-radius:16px;padding:16px 18px;display:flex;gap:16px;align-items:center;background:#fff}
.k112>a{flex:none;font:700 56px/1 FwCond,sans-serif;color:var(--rot);text-decoration:none}

/* Listen */
.sh{display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap}
.sh a{font-weight:600;font-size:16px}
.list{border-top:1px solid var(--linie)}
.li{display:flex;gap:14px;padding:14px 0;border-bottom:1px solid var(--linie);color:var(--ink);text-decoration:none;align-items:flex-start;width:100%;background:none;border-left:0;border-right:0;border-top:0;text-align:left}
.li:hover{background:#FAFAF8}
.li .dt{width:56px;flex:none;font-weight:700}
.li b{display:block}
.tag{display:inline-block;font-size:13px;font-weight:700;padding:2px 8px;border-radius:6px}
.t-thl{background:#E7F0FB;color:#1D4F8C}.t-brand{background:#FBEAEA;color:#A51214}.t-bma{background:#EFEEEB;color:#4A4F55}.t-unw{background:#E6F2EA;color:#1E6B35}.t-news{background:#FFF1D6;color:#6B4500}
.neu{animation:glow 2.6s ease-out 1}
@keyframes glow{0%{background:#FFE3E1}100%{background:transparent}}
.cal{width:56px;height:56px;flex:none;border-radius:12px;background:var(--hell);display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.1}
.cal b{font-size:20px}.cal span{font-size:13px;color:var(--g2)}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{min-height:44px;padding:0 16px;border-radius:999px;border:2px solid #D9D7D2;background:#fff;font-weight:600;font-size:15px}
.chip[aria-pressed=true]{background:var(--ink);border-color:var(--ink);color:#fff}
.tip{display:flex;gap:14px;background:#FFF6DB;border-radius:16px;padding:18px;color:var(--ink);text-decoration:none}
.tip svg{flex:none;width:32px;height:32px;color:#8A5A00}



.ig{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
.ig div{aspect-ratio:1;border-radius:8px;background:#E9E7E2;display:flex;align-items:center;justify-content:center;font-size:13px;color:var(--g2);text-align:center;padding:6px}
.ig div:nth-child(even){background:#DEDBD5}
.ig div.post{background:var(--rot);color:#fff;font-weight:700}
.card{border:1px solid var(--linie);border-radius:16px;padding:18px;background:#fff;display:flex;flex-direction:column;gap:10px}
.kv{display:grid;grid-template-columns:110px minmax(0,1fr);gap:4px 10px;font-size:16px}
.kv>span{color:var(--g2)}
.stat{background:var(--hell);border-radius:16px;padding:18px;display:flex;flex-direction:column;gap:10px}
.stat .num{font:700 48px/1 FwCond,sans-serif}
.bars{display:grid;grid-template-columns:110px minmax(0,1fr) 28px;gap:8px 10px;align-items:center;font-size:15px}
.bars i{display:block;height:10px;border-radius:5px}
.bars b{text-align:right}
.alert{background:var(--rot);color:#fff;border-radius:16px;padding:18px}
.alert ol{margin:8px 0 0;padding-left:22px;display:flex;flex-direction:column;gap:4px}

/* Formulare */
.f{display:flex;flex-direction:column;gap:5px;font-weight:600;font-size:15px}
.f input,.f select,.f textarea{font:16px FwText,sans-serif;font-weight:400;border:1px solid #9C9992;border-radius:10px;padding:10px 12px;min-height:48px;background:#fff;width:100%}
.f textarea{resize:vertical;min-height:96px}
.f input:user-invalid{border-color:var(--rot)}
.chk{display:flex;gap:10px;align-items:flex-start;font-size:15px;min-height:44px;padding-top:4px}
.chk input{width:22px;height:22px;margin:1px 0 0;flex:none;accent-color:var(--rot)}
.chk .ct{flex:1;min-width:0}
.err{color:var(--rot-d);font-weight:600;font-size:15px}
.err:empty{display:none}

/* Fuß */
.foot{background:var(--ink);color:#C9CBCE;padding:28px 0 calc(96px + var(--sab));font-size:15px}
.foot .wrap{display:flex;flex-direction:column;gap:14px}
.foot .logo{width:140px;height:38px}
.foot nav{display:flex;flex-wrap:wrap;gap:6px 18px}
.foot a{color:#fff}
.foot .mini{color:#A9ADB2}

/* Backend */
body.bk{background:var(--hell)}
.btop{position:sticky;top:0;z-index:40;background:var(--ink);color:#fff;padding-top:var(--sat)}
.btop .wrap{display:flex;align-items:center;justify-content:space-between;gap:10px;min-height:60px}
.btop .logo{width:118px;height:32px}
.btop .who{display:block;min-height:0;padding-bottom:8px;margin-top:-4px;color:#C9CBCE;font-size:13px;line-height:1.3;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.btop .who b{color:#fff}
.btop button{background:none;border:1px solid #555B62;color:#fff;border-radius:999px;min-height:44px;padding:0 12px;font-size:14px;font-weight:600}
.btop .hb{display:inline-flex;align-items:center;gap:6px;border:1px solid #555B62;color:#fff;border-radius:999px;min-height:44px;min-width:44px;justify-content:center;padding:0 12px;font-size:14px;font-weight:600;text-decoration:none}.btop .hb svg{width:20px;height:20px}
.btop .tr{display:flex;align-items:center;gap:8px}

  return sec(`<div class="login stack"><h1>Login für Mitglieder</h1><p>Nur für eingeladene Mitglieder des Feuerwehr Piflas e.V. Deine Rolle ist in deinem Konto hinterlegt – du musst nichts auswählen.</p>
    <form class="card" id="f-login" novalidate>
      ${f('E-Mail', '<input name="mail" type="email" required autocomplete="username" maxlength="120">')}
      ${f('Passwort', '<input name="pw" type="password" required autocomplete="current-password" maxlength="200">')}
      <label class="chk"><input type="checkbox" name="stay"><span class="ct">Auf diesem Gerät angemeldet bleiben</span></label><span class="mini" style="margin-top:-6px">Gilt nur für die Rolle „Mitglied“, bis zu 90 Tage (E-25). Auf fremden Geräten nicht anhaken.</span>
      <p class="err" id="e-login"></p><button class="btn" type="submit">Anmelden</button>
      <button type="button" class="lnk" data-act="pw-forgot" aria-expanded="${!!S.pwf}">Passwort vergessen?</button>
      <span class="mini" id="demo-konten">Demo-Konten, Passwort beliebig: max@beispiel.de (Kommandant), erika@beispiel.de (Admin), jonas@beispiel.de (Redaktion), anna@beispiel.de (Mitglied)</span></form>
    ${S.pwf ? `<form class="card" id="f-pw" novalidate><b>Passwort zurücksetzen</b>${f('Deine E-Mail', '<input name="m" type="email" required autocomplete="username" maxlength="120">')}<p class="err" id="e-pw"></p><button class="btn" type="submit">Link schicken</button><span class="mini">Der Link gilt einmalig 1 Stunde. Danach legst du ein neues Passwort fest.</span></form>` : ''}
    <div class="card stack" id="quick"><b>Schnell-Login für die Demo</b><span class="mini">Ohne E-Mail und Code – einfach ein Beispielkonto wählen:</span><div class="row2 ql"><button class="btn o sm" type="button" data-act="quick-login" data-role="Freigeber" style="color:var(--ink)">Kommandant</button><button class="btn o sm" type="button" data-act="quick-login" data-role="Administrator" style="color:var(--ink)">Admin</button><button class="btn o sm" type="button" data-act="quick-login" data-role="Autor" style="color:var(--ink)">Redaktion</button><button class="btn o sm" type="button" data-act="quick-login" data-role="Mitglied" style="color:var(--ink)">Mitglied</button></div>
    </div><span class="mini">Kein Konto? Konten werden nur per Einladung durch die Admins vergeben.</span></div>`);
};

/* ---------- Backend ---------- */
/* Rechte (B-01: jedes Konto hat genau eine Rolle) */
const isAdm = () => !!S.user && S.user.role === 'Administrator';
const isKdt = () => !!S.user && S.user.role === 'Freigeber';
const isRed = () => !!S.user && (S.user.role === 'Autor' || S.user.role === 'Bereich Jugend');
const canEdit = n => !!S.user && (!isRed() || n.by === S.user.name);
const nImgs = n => n.imgs && n.imgs.length ? n.imgs : (n.img ? [n.img] : []);
const fmtTs = ts => { const d = new Date(ts); return `${p2(d.getDate())}.${p2(d.getMonth()+1)}.${d.getFullYear()}, ${p2(d.getHours())}:${p2(d.getMinutes())} Uhr`; };
const who = () => S.user ? S.user.name : 'System';
const von = () => S.user.name + ' (' + RL[S.user.role] + ')';

/* ---------- Verlauf (B-07), Spam-Schutz (N-05) ----------
   KINDS: welche Inhalte einen Verlauf haben und welche Felder eine Fassung bilden.
   Regeln: Einträge werden nur angehängt (niemand kann sie ändern oder löschen), der Name kommt aus der Anmeldung,
   Speichern ohne Änderung erzeugt keinen Eintrag, schnelle Folge-Änderungen derselben Person (10 Min.) werden
   zusammengefasst, mehr als RL_MAX Änderungen in 10 Minuten werden abgewiesen. */
const KINDS = {
  n: {l:'Beitrag', list:() => S.news, f:['t','cat','d','body','txt','imgs','img','alt']},
  e: {l:'Einsatzbericht', list:() => S.einsaetze, f:['t','typ','d','y','z','fz','txt','imgs']},
  fz: {l:'Fahrzeug', list:() => S.fz, f:['n','kurz','d','lang','alt','img','neu']},
  g: {l:'Gerät', list:() => S.ger, f:['n','alt','img']},
  v: {l:'Seite „Verein & Chronik“', list:() => [S.verein], f:['intro','vorstand','chronik']}
};
const FLAB = {t:'Titel', cat:'Kategorie', d:'Datum/Beschreibung', body:'Text', txt:'Text', imgs:'Fotos', img:'Foto', alt:'Bildbeschreibung', typ:'Einsatzart', y:'Jahr', z:'Uhrzeit', fz:'Fahrzeuge', n:'Name', kurz:'Kurzname', lang:'Vorstellungstext', neu:'„Neu im Fuhrpark“', intro:'Einleitung', vorstand:'Vorstandschaft', chronik:'Chronik'};
const getC = (k, id) => KINDS[k] && KINDS[k].list().find(x => String(x.id) === String(id));
/* leere Werte (undefined, '', [], false) gelten als gleich – so erzeugt „Speichern ohne Änderung“ keinen Eintrag */
const nz = v => v === undefined || v === '' || v === false || (Array.isArray(v) && !v.length) ? null : v;
const pick = (k, o) => Object.fromEntries(KINDS[k].f.map(x => [x, nz(o[x])]));
const sj = (k, o) => JSON.stringify(pick(k, o));
const hk = (k, id) => k + ':' + id;
const MERGE_MS = 10 * 60e3, RL_MAX = 30, RL_MS = 10 * 60e3, H_MAX = 50;
function hInit(k, o) {
  const key = hk(k, o.id);
  if (!S.hist[key]) S.hist[key] = [{ts: S.t0, by: o.by || (k === 'e' ? (o.hand || 'DIVERA (automatisch)') : 'Ausgangsfassung'), act: 'Ausgangsfassung', snap: sj(k, o), n: 1, note: '', ok: ''}];
  return S.hist[key];
}
function hLog(k, o, act, x = {}) {
  const h = hInit(k, o), last = h[h.length - 1], now = Date.now(), by = x.by || who();
  if (act === 'Bearbeitet' && !x.ok && !x.note && last.act === 'Bearbeitet' && last.by === by && !last.ok && now - last.ts < MERGE_MS) { last.snap = sj(k, o); last.ts = now; last.n++; return; }
  h.push({ts: now, by, act, snap: sj(k, o), n: 1, note: x.note || '', ok: x.ok || ''});
  if (h.length > H_MAX) h.splice(1, h.length - H_MAX);
}
function rateOk() {
  const now = Date.now(), u = who(), l = (S.rl[u] || []).filter(t => now - t < RL_MS);
  S.rl[u] = l;
  if (l.length >= RL_MAX) { toast('Zu viele Änderungen in kurzer Zeit. Bitte warte ein paar Minuten.'); return false; }
  l.push(now); return true;
}
/* Speichert Änderungen an einem Inhalt mit Verlaufseintrag. false = nichts gespeichert. */
function saveC(k, o, vals, x = {}) {
  hInit(k, o);
  if (sj(k, o) === sj(k, {...o, ...vals})) { toast('Keine Änderung – nichts gespeichert'); return false; }
  if (!x.noRate && !rateOk()) return false;
  Object.assign(o, vals); hLog(k, o, x.act || 'Bearbeitet', x); return true;
}
const hEv = (k, o, act) => { hInit(k, o); hLog(k, o, act); };
const changed = (k, a, b) => KINDS[k].f.filter(x => JSON.stringify(nz(a[x])) !== JSON.stringify(nz(b[x]))).map(x => FLAB[x] || x).filter((v, i, l) => l.indexOf(v) === i);
const histHtml = (k, o) => {
  const h = hInit(k, o), cur = sj(k, o), red = isRed(), may = k === 'e' ? !red : k === 'n' ? canEdit(o) : true;
  const li = h.map((x, i) => { const prev = i ? JSON.parse(h[i - 1].snap) : null, now = JSON.parse(x.snap), ch = prev ? changed(k, prev, now) : [], last = i === h.length - 1;
    return `<li class="${last ? 'cur' : ''}"><div class="hrow"><span class="hdot" aria-hidden="true"></span><span><b>${esc(x.act)}</b>${x.n > 1 ? ` <span class="mini">(${x.n} Änderungen zusammengefasst)</span>` : ''}${last ? ' <span class="tag hnow">aktuell</span>' : ''}<span class="mini" style="display:block">${fmtTs(x.ts)} · ${esc(x.by)}${x.ok ? ' · freigegeben von ' + esc(x.ok) : ''}</span></span></div>
      ${ch.length ? `<span class="mini">Geändert: ${esc(ch.join(', '))}</span>` : ''}${x.note ? `<span class="hnote">„${esc(x.note)}“</span>` : ''}
      ${ch.length ? `<details class="hd"><summary>Was wurde geändert?</summary>${legend}${diffHtml(k, prev, now)}</details>` : ''}
      ${may && x.snap !== cur ? `<button class="btn o sm" data-act="h-restore" data-k="${k}" data-id="${esc(o.id)}" data-i="${i}" style="color:var(--ink)">${red ? 'Diese Fassung zur Freigabe einreichen' : 'Diese Fassung wiederherstellen'}</button>` : ''}</li>`; }).reverse().join('');
  return `<details class="help vl" id="verlauf-${k}-${esc(o.id)}"${S.hOpen === hk(k, o.id) ? ' open' : ''}><summary>Verlauf (${h.length} ${h.length === 1 ? 'Eintrag' : 'Einträge'})</summary><p class="mini">Neueste Änderung oben. Jede Änderung wird mit Name und Zeit gespeichert; niemand kann Einträge ändern oder löschen. „Was wurde geändert?“ zeigt den Unterschied zur Fassung davor.</p><ol class="hist">${li}</ol></details>`;
};

/* ---------- Vergleich vorher/nachher für Freigabe und Verlauf (W-08, B-07) ----------
   Wort für Wort: Entferntes rot durchgestrichen, Neues grün unterstrichen. */
const wdiff = (a, b) => {
  const A = String(a).split(/(\s+)/).filter(Boolean), B = String(b).split(/(\s+)/).filter(Boolean), n = A.length, m = B.length;
  if (n * m > 400000) return `<del>${esc(a)}</del> <ins>${esc(b)}</ins>`;
  const L = Array.from({length: n + 1}, () => new Uint16Array(m + 1));
  for (let i = n - 1; i >= 0; i--) for (let j = m - 1; j >= 0; j--) L[i][j] = A[i] === B[j] ? L[i + 1][j + 1] + 1 : Math.max(L[i + 1][j], L[i][j + 1]);
  const out = []; let i = 0, j = 0; const put = (t, x) => { const l = out[out.length - 1]; if (l && l[0] === t) l[1] += x; else out.push([t, x]); };
  while (i < n && j < m) { if (A[i] === B[j]) { put('=', A[i]); i++; j++; } else if (L[i + 1][j] >= L[i][j + 1]) put('-', A[i++]); else put('+', B[j++]); }
  while (i < n) put('-', A[i++]); while (j < m) put('+', B[j++]);
  return out.map(([t, x]) => t === '=' ? esc(x) : t === '-' ? `<del>${esc(x)}</del>` : `<ins>${esc(x)}</ins>`).join('');
};
const fval = (x, v) => v === null || v === undefined || v === '' ? '' : x === 'body' ? v.join('\n\n') : x === 'typ' ? ART[v][1] : x === 'neu' ? (v ? 'ja' : 'nein') : String(v);
const pics = (l, cls) => `<span class="dpics ${cls}">${l.filter(k => k && IMG[k]).map(k => `<img src="${IMG[k]}" alt="">`).join('') || '<i>kein Foto</i>'}</span>`;
const rowsDiff = (a, b) => { const A = a || [], B = b || [];
  return `<ul class="drows">${B.map(r => A.includes(r) ? `<li>${esc(r)}</li>` : `<li class="add"><ins>+ ${esc(r)}</ins></li>`).join('')}${A.filter(r => !B.includes(r)).map(r => `<li class="rem"><del>− ${esc(r)}</del></li>`).join('')}</ul>`; };
/* Liste der geänderten Felder mit hervorgehobenem Unterschied; nur Felder, die sich wirklich ändern */
const diffHtml = (k, a, b) => {
  const fs = KINDS[k].f.filter(x => (k !== 'n' || x !== 'txt') && JSON.stringify(nz(a[x])) !== JSON.stringify(nz(b[x])) && !(x === 'img' && KINDS[k].f.includes('imgs')));
  if (!fs.length) return '<p class="mini" style="margin:0">Keine Abweichung zur aktuellen Fassung.</p>';
  return `<div class="diff">${fs.map(x => { let v;
    if (x === 'img' || x === 'imgs') { const A = x === 'img' ? [a.img] : (a.imgs || []), B = x === 'img' ? [b.img] : (b.imgs || []); v = `<div class="dimg">${pics(A, 'old')}<span aria-hidden="true">→</span>${pics(B, 'new')}</div>`; }
    else if (x === 'vorstand') v = rowsDiff((a.vorstand || []).map(r => r.filter(Boolean).join(': ')), (b.vorstand || []).map(r => r.filter(Boolean).join(': ')));
    else if (x === 'chronik') v = rowsDiff((a.chronik || []).map(c => c.y + ' – ' + c.t + (c.x ? ' (' + c.x + ')' : '')), (b.chronik || []).map(c => c.y + ' – ' + c.t + (c.x ? ' (' + c.x + ')' : '')));
    else if (x === 'body' && a.body && b.body) { const A = a.body, B = b.body; let p = 0, q = 0;
      while (p < A.length && p < B.length && A[p] === B[p]) p++;
      while (q < A.length - p && q < B.length - p && A[A.length - 1 - q] === B[B.length - 1 - q]) q++;
      const keep = n => n ? `<p class="mini" style="margin:0">… ${n} ${n === 1 ? 'Absatz' : 'Absätze'} unverändert …</p>` : '';
      v = keep(p) + `<p class="dtext">${wdiff(A.slice(p, A.length - q).join('\n\n'), B.slice(p, B.length - q).join('\n\n'))}</p>` + keep(q); }
    else { const o = fval(x, a[x]), nw = fval(x, b[x]); v = `<p class="dtext">${!o ? `<ins>${esc(nw)}</ins>` : !nw ? `<del>${esc(o)}</del>` : wdiff(o, nw)}</p>`; }
    return `<div class="drow"><b class="dlab">${esc(flab(k, x))}</b>${v}</div>`; }).join('')}</div>`;
};
const flab = (k, x) => x === 'd' ? (k === 'fz' ? 'Beschreibung' : 'Datum') : (FLAB[x] || x);
const legend = '<p class="mini legend" style="margin:0"><ins>grün = neu</ins> · <del>rot = entfernt</del></p>';

/* ---------- Rückgängig (B-17) ----------
   Vor jeder Änderung wird der Stand gemerkt (snapAll); done() zeigt die Meldung mit „Rückgängig“. */
/* Testergebnisse (results) bewusst nicht: Rückgängig darf keinen Testversuch löschen */
const UK = ['einsaetze','news','queue','trash','dropped','fz','ger','verein','members','plan','settings','posts','iface','topics'];
let UNDO = null;
const snapAll = () => ({j: JSON.stringify(UK.map(k => S[k])), img: {...IMG}, gone: {...S.gone}});
/* B-10: nach dem Speichern bleibt man in der Ansicht; die Meldung bietet „Ansehen“ (Beitrag, Einsatzbericht oder Vorschau) */
const viewOf = (ref, vw) => { if (vw) return vw; if (!ref) return null;
  if (ref[0] === 'n') { const n = S.news.find(x => x.id === ref[1]); return n && !n.hid ? ['n', n.id] : null; }
  if (ref[0] === 'e') { const e = S.einsaetze.find(x => x.id === ref[1]); return e && !e.hid && !e.ab ? ['e', e.id] : null; }
  return null; };
const viewBtn = (vw, cls) => `<button type="button" class="${cls}" data-act="view" data-k="${vw[0]}" data-id="${esc(vw[1])}"${cls === 'tb' ? '' : ' style="color:var(--ink)"'}>${vw[0] === 'q' ? 'Vorschau ansehen' : vw[0] === 'e' ? 'Bericht ansehen' : 'Beitrag ansehen'}</button>`;
const done = (msg, u, ref, vw) => { const v = viewOf(ref, vw); UNDO = {u, ref, msg, at:Date.now(), view:v}; toast(msg, true, v); };
/* Die letzte Aktion bleibt 5 Minuten oben sichtbar – auch nach dem Veröffentlichen auf der Beitrags- oder Einsatzseite */
const UNDO_MS = 5 * 60e3;
const undoBar = () => S.user && UNDO && Date.now() - UNDO.at < UNDO_MS ? `<div class="wrap"><div class="undobar" id="undo-bar" role="status"><span><b>Zuletzt:</b> ${esc(UNDO.msg)}</span><span class="row2" style="gap:8px">${UNDO.view && !(UNDO.view[0] === 'n' && S.article === UNDO.view[1] && route() === 'aktuelles') && !(UNDO.view[0] === 'e' && S.detail === UNDO.view[1] && route() === 'einsaetze') ? viewBtn(UNDO.view, 'btn o sm') : ''}<button type="button" class="btn o sm" data-act="undo" style="color:var(--ink)">Rückgängig</button></span></div></div>` : '';
function undo() {
  if (!UNDO) return; const {u, ref} = UNDO; UNDO = null;
  JSON.parse(u.j).forEach((v, i) => { S[UK[i]] = v; });
  Object.assign(IMG, u.img); S.gone = u.gone;
  if (ref) { const o = getC(ref[0], ref[1]); if (o) hEv(ref[0], o, 'Rückgängig gemacht'); }
  S.cdel = null; S.sdel = null;
  if (S.ed && S.ed.id && !getC(S.ed.k, S.ed.id)) S.ed = null;
  toast('Rückgängig gemacht'); render({keep:true});
}

/* ---------- Bausteine Mitgliederbereich ---------- */
const thumbs = () => S.draft.map((k, i) => `<span class="th"><img src="${IMG[k]}" alt="Foto ${i + 1}${i === 0 ? ' (Titelbild)' : ''}">${i ? `<button type="button" class="tb1" data-act="draft-first" data-i="${i}" aria-label="Foto ${i + 1} als Titelbild">Titelbild</button>` : '<span class="tb1 on" aria-hidden="true">Titelbild</span>'}<button type="button" class="ib sm" data-act="draft-rm" data-i="${i}" aria-label="Foto ${i + 1} entfernen">×</button></span>`).join('');
const qThumbs = q => (q.imgs || []).map((k, i) => `<span class="th"><img src="${IMG[k]}" alt="Einsatzfoto ${i + 1}"><button type="button" class="ib sm" data-act="q-img-rm" data-id="${q.id}" data-i="${i}" aria-label="Foto ${i + 1} entfernen">×</button></span>`).join('');
const delBox = (k, id, what) => `<div class="stat" style="font-size:15px;padding:10px 12px" id="del-box"><b>${what} wirklich löschen?</b> Er verschwindet sofort von der Website. 30 Tage lang kannst du ihn im Papierkorb wiederherstellen. Ein Instagram-Post bleibt bestehen – den bitte in Instagram löschen.</div><div class="row2"><button class="btn sm" data-act="c-del-ok" data-k="${k}" data-id="${esc(id)}">Ja, löschen</button><button class="btn o sm" data-act="c-del-no" style="color:var(--ink)">Abbrechen</button></div>`;
const pending = (k, o) => S.queue.some(q => (k === 'n' && q.of === o.id) || (q.kind === 'change' && q.k === k && String(q.tid) === String(o.id)));
const stOf = (k, o) => o.hid ? ['Ausgeblendet', 'off'] : (o.ab && o.ab > Date.now()) ? ['Geplant · erscheint ' + fmtTs(o.ab), 'plan'] : pending(k, o) ? ['Online · Änderung wartet auf Freigabe', 'wait'] : ['Online', 'on'];
const ivBanner = () => { const d = S.iface.div; if (d.st !== 'bad' && !d.man) return '';
  return `<div class="tip" id="div-warn" style="background:#FBEAEA"><span><b style="display:block">${d.man ? 'Notbetrieb: DIVERA-Import ist angehalten' : 'DIVERA ist gestört (' + esc(d.code) + ')'}</b>Neue Einsätze kommen gerade nicht automatisch. Lege sie bei Bedarf von Hand an – die Website läuft normal weiter.<span class="row2" style="margin-top:8px"><button class="btn sm" data-act="new" data-k="e">Einsatz von Hand anlegen</button>${isAdm() ? '<a class="btn o sm" href="#system" style="color:var(--ink)">Zur Diagnose</a>' : ''}</span></span></div>`; };

/* ---------- Freigabe: klar erkennbar, was neu ist und was sich ändert ---------- */
const qKind = q => q.kind === 'einsatz' ? ['Neuer Einsatzbericht', 'e', q.hand ? 'von Hand angelegt' : 'automatisch aus DIVERA']
  : q.kind === 'news' ? (q.of ? ['Änderung · Beitrag', 'c', 'eingereicht von ' + q.von] : ['Neuer Beitrag', 'n', 'eingereicht von ' + q.von])
  : q.add ? ['Neu · ' + KINDS[q.k].l, 'n', 'eingereicht von ' + q.von] : ['Änderung · ' + KINDS[q.k].l, 'c', 'eingereicht von ' + q.von];
V.redaktion = () => {
  const okTxt = q => q.kind === 'einsatz' ? 'Geprüft: keine erkennbaren Personen, Kennzeichen, Adressen oder vertraulichen Details (Verschwiegenheit, Datenschutz).' : q.kind === 'change' ? 'Geprüft: Angaben stimmen, Bildrechte geklärt, keine vertraulichen Details.' : 'Geprüft: Bildrechte geklärt, Abgebildete informiert bzw. einverstanden (bei Kindern die Eltern), keine vertraulichen Details.';
  const acts = q => `<div class="qact">
      ${q.kind === 'news' && !q.of ? `<label class="chk"><input type="checkbox" id="ig-${q.id}" ${q.ig ? 'checked' : ''}><span class="ct">Auch auf Instagram posten</span></label>` : ''}
      <label class="chk"><input type="checkbox" id="ok-${q.id}" ${q.ok ? 'checked' : ''}><span class="ct">${okTxt(q)}</span></label>
      <p class="err" id="e-${q.id}"></p>
      <div class="pb"><button class="btn" data-act="publish" data-id="${q.id}">${q.kind === 'change' ? 'Übernehmen' : 'Veröffentlichen'}</button><button class="btn o" data-act="drop" data-id="${q.id}" style="color:var(--ink)">${q.kind === 'einsatz' ? 'Verwerfen' : 'Zurück zur Überarbeitung'}</button></div>
      ${q.kind === 'einsatz' ? '' : f('Hinweis bei Rückgabe (optional)', `<input id="note-${q.id}" maxlength="300" placeholder="z. B. Bitte noch Datum ergänzen">`)}</div>`;
  const card = q => { const [lab, cls, sub] = qKind(q);
    const head = `<div class="qh"><span class="qk qk-${cls}">${esc(lab)}</span><span class="mini">${esc(sub)}</span></div>`;
    if (q.kind === 'einsatz') return `
    <article class="card qc" data-q="${q.id}">${head}
      <h2 style="font-size:26px">${esc(q.t)}</h2>
      <div class="kv"><span>Einsatzart</span><b>${ART[q.typ][1]}</b><span>Zeit</span><b>${q.d}${q.y}, ${q.z} Uhr</b><span>Ort</span><b>${esc(q.t.split(', ').slice(1).join(', '))}</b><span>Fahrzeuge</span><b>${esc(q.fz)}</b></div>
      ${f('Kurzbericht (optional)', `<textarea id="txt-${q.id}" maxlength="3000">${esc(q.txt)}</textarea>`)}

      ${acts(q)}</article>`;
    let body, title;
    if (q.kind === 'news' && q.of) { const n = getC('n', q.of); if (!n) return ''; title = n.t;
      body = `<p class="qsum">Was sich ändert:</p>${diffHtml('n', n, {...n, ...editVals(q, n)})}<p class="mini" style="margin:0">Bis zur Freigabe bleibt die bisherige Fassung online.</p>`; }

    else { const o = getC(q.k, q.tid); if (!o) return ''; title = o.n || o.t || 'Verein & Chronik';

/* ---------- Inhalte: Übersicht mit Suche, Filtern und Seitenweise-Laden (B-18) ---------- */
const pdd = s => { const m = /^(\d\d)\.(\d\d)\./.exec(s || ''); return m ? +m[2] * 100 + +m[1] : 0; };

  <div class="stat" style="font-size:15px" id="rollen"><b>Jedes Konto hat genau eine Rolle.</b> Aktiv: ${cntR('Freigeber')} Kommandanten · ${cntR('Administrator')} Admins · ${cntR('Autor') + cntR('Bereich Jugend')} Redaktion · ${cntR('Mitglied')} Mitglieder (nur Lernen). Es gibt immer mindestens zwei Admins.</div>
  <form class="card" id="f-invite" novalidate><h2 style="font-size:26px">Neues Mitglied einladen</h2>
    ${f('Name', '<input name="n" required autocomplete="off" maxlength="80">')}${f('E-Mail', '<input name="m" type="email" required autocomplete="off" maxlength="120">')}
    ${f('Rolle', '<select name="r"><option value="Autor">Redaktion</option><option value="Freigeber">Kommandant · Freigabe</option><option value="Bereich Jugend">Redaktion Jugend</option><option value="Administrator">Admin</option><option value="Mitglied">Mitglied · nur Lernen</option></select>')}
    <label class="chk"><input type="checkbox" name="akt" checked><span class="ct">Gehört zur Einsatzabteilung – zählt im Lernstand</span></label>
    <p class="err" id="e-invite"></p><button class="btn" type="submit">Einladung senden</button><span class="mini">Link 48 Std. gültig; das Mitglied legt sein Passwort selbst fest.</span></form>
  <h2 style="font-size:26px">Alle Konten <span class="mini">(Beispiel)</span></h2>
  <div class="stack" id="mlist">${S.members.map((m, i) => `<div class="card" style="gap:6px${m.inv ? ';border-style:dashed' : ''}"><div class="sh"><b>${esc(m.n)}</b><span class="tag t-bma">${esc(RL[m.r] || m.r)}</span></div><span class="${m.inv ? 'st-wait' : 'st-ok'}" style="font-size:15px">${esc(m.s)}</span>${m.akt === false ? '<span class="mini">Nicht in der Einsatzabteilung – zählt nicht im Lernstand</span>' : ''}${m.inv ? `<div class="row2"><button class="btn o sm" data-act="resend" data-i="${i}" style="color:var(--ink)">Erneut senden</button><button class="btn o sm" data-act="revoke" data-i="${i}" style="color:var(--ink)">Zurückziehen</button></div>` : m.off ? `<div class="row2"><button class="btn o sm" data-act="m-on" data-i="${i}" style="color:var(--ink)">Wieder aktivieren</button></div>` : roleEd(m, i) + offEd(m, i)}</div>`).join('')}</div>`);
/* Austritt (B-08): Konto deaktivieren statt löschen – Beiträge bleiben, Anmelden geht nicht mehr; nie unter zwei Admins (A-08) */
const offEd = (m, i) => m.n === S.user.name || S.rch === i ? '' : S.moff !== i ? `<div class="row2"><button class="btn o sm" data-act="m-off" data-i="${i}" style="color:var(--ink)">Deaktivieren (Austritt)</button></div>`
  : `<div class="stat warnbox stack" style="gap:8px;font-size:15px" id="moff-ask"><span><b>${esc(m.n)} deaktivieren?</b> Anmelden geht dann nicht mehr. Beiträge und Verlauf bleiben erhalten, Lernergebnisse werden gelöscht (E-11). Du kannst das Konto später wieder aktivieren.</span><div class="row2"><button class="btn sm" data-act="m-off-ok" data-i="${i}">Ja, deaktivieren</button><button class="btn o sm" data-act="m-off-no" style="color:var(--ink)">Abbrechen</button></div></div>`;
/* Rolle ändern (B-02): nur Admins, nie die eigene Rolle, immer mindestens zwei Admins (A-08) */
const ROPT = [['Mitglied','Mitglied · nur Lernen'],['Autor','Redaktion'],['Bereich Jugend','Redaktion Jugend'],['Freigeber','Kommandant · Freigabe'],['Administrator','Admin']];
const roleEd = (m, i) => m.n === S.user.name ? '<span class="mini">Deine eigene Rolle ändert ein anderer Admin.</span>'
  : S.rch !== i ? `<div class="row2"><button class="btn o sm" data-act="r-edit" data-i="${i}" style="color:var(--ink)">Rolle ändern</button></div>`
  : `<form id="f-role" class="stack" style="gap:8px" novalidate>${f('Neue Rolle für ' + esc(m.n), `<select name="r">${ROPT.map(([v, l]) => `<option value="${v}"${m.r === v ? ' selected' : ''}>${l}</option>`).join('')}</select>`)}
    <label class="chk"><input type="checkbox" name="akt"${m.akt !== false ? ' checked' : ''}><span class="ct">Gehört zur Einsatzabteilung – zählt im Lernstand</span></label>
    <p class="err" id="e-role"></p><span class="mini">Gilt sofort. Für Admin und Kommandant ist die 2-Faktor-Anmeldung Pflicht. Lernergebnisse bleiben erhalten.</span>
    <div class="row2"><button class="btn sm" type="submit">Speichern</button><button class="btn o sm" type="button" data-act="r-no" style="color:var(--ink)">Abbrechen</button></div></form>`;


/* ---------- E-Mail an die Kommandanten (W-09) – in der Demo als Postfach dargestellt ----------
   Echte Website: Versand per SMTP; die Mail nennt nur Art und einreichende Person und verlinkt auf die Freigabe
   (Anmeldung mit 2FA nötig). Keine Inhalte, keine Knöpfe zum Freigeben in der Mail. */
const kdts = () => S.members.filter(m => m.r === 'Freigeber' && !m.inv);
const qCopy = q => JSON.parse(JSON.stringify(q));
const syncMails = () => S.queue.forEach(q => { if (!S.mailed.includes(q.id)) { S.mailed.push(q.id); S.mails.unshift({id:'m' + (S.nid++), at:Date.now(), typ:'neu', qs:[qCopy(q)]}); } });
/* Die Mail nennt nur Art und einreichende Person – keine Inhalte (Verschwiegenheit, L-02) */
const qWhat = q => q.kind === 'einsatz' ? 'Ein neuer Einsatzbericht' + (q.hand ? ' (von Hand angelegt)' : ' aus DIVERA') : qKind(q)[0] + ' von ' + q.von;
const mSubj = m => m.typ === 'neu' ? 'Neu zur Freigabe: ' + qKind(m.qs[0])[0] : 'Erinnerung: ' + m.qs.length + (m.qs.length === 1 ? ' Einreichung wartet' : ' Einreichungen warten') + ' auf Freigabe';
V.postfach = () => {
  const k = kdts()[0], hd = `<div class="tip" style="background:#E8EEF7;padding:12px"><span style="font-size:15px"><b>Nur Demo:</b> So sieht das E-Mail-Postfach von ${esc(k.n)} (Kommandant) aus. Die echte Website verschickt diese Mails an alle Kommandanten.</span></div>`;
  const m = S.mview && S.mails.find(x => x.id === S.mview);
  if (m) { const open = m.qs.filter(q => S.queue.some(x => x.id === q.id));
    return sec(`${hd}<button class="btn o sm" data-act="mail-back" style="align-self:flex-start;color:var(--ink)">← Postfach</button>
    <article class="card mail" id="mail"><div class="mhead"><span><b>Von:</b> Website Feuerwehr Piflas &lt;noreply@feuerwehr-piflas.de&gt;</span><span><b>An:</b> ${kdts().map(x => esc(x.n)).join(', ')}</span><span><b>Betreff:</b> ${esc(mSubj(m))}</span><span class="mini">${fmtTs(m.at)}</span></div>
      <p>Hallo ${esc(k.n.split(' ')[0])},</p>
      <p>${m.typ === 'neu' ? 'auf der Website wartet etwas Neues auf deine Freigabe:' : 'auf der Website ' + (m.qs.length === 1 ? 'wartet noch eine Einreichung' : 'warten noch ' + m.qs.length + ' Einreichungen') + ' auf Freigabe:'}</p>
      <ul class="mlist">${m.qs.map(q => `<li>${esc(qWhat(q))}</li>`).join('')}</ul>
      ${open.length ? '<a class="btn" href="#redaktion" id="mail-link" style="align-self:flex-start">Zur Freigabe</a>' : '<p class="mini" id="mail-done" style="margin:0"><b>Schon erledigt.</b> Inzwischen hat jemand freigegeben oder zurückgegeben.</p>'}
      <p class="mini">Aus Datenschutzgründen steht der Inhalt nicht in der Mail – du siehst ihn nach dem Anmelden. Du bekommst diese Mail, weil du die Rolle „Kommandant · Freigabe“ hast. Es reicht, wenn eine Person freigibt.${S.settings.mailOn ? ' Solange etwas offen ist, kommt täglich um ' + esc(S.settings.mailT) + ' Uhr eine Erinnerung.' : ''} Ohne Tracking.</p></article>`); }
  return sec(`${hd}<h1 style="font-size:34px">Postfach</h1><div class="list" id="inbox">${S.mails.map(x => `<button class="li" data-act="mail-open" data-id="${x.id}"><span class="dt">${p2(new Date(x.at).getHours())}:${p2(new Date(x.at).getMinutes())}</span><span style="flex:1;min-width:0"><span class="mini">${x.typ === 'neu' ? 'Neue Einreichung' : 'Tägliche Erinnerung'}</span><b>${esc(mSubj(x))}</b></span></button>`).join('') || '<p class="leer">Keine E-Mails.</p>'}</div>`);
};

/* ---------- Lernen (Lastenheft 2.12 „Lernen“ E-01 bis E-14, 2.13 „Gern und leicht lernen“ E-15 bis E-28) ----------
   Jeden Monat ein Thema vom Kommandanten: in kleinen Schritten lesen, dann 5 Fragen, eine pro Bildschirm.
   Ergebnisse sieht jede Person nur für sich; den Lernstand aller sehen nur die Kommandanten (kein Admin).
   Freiwillig, keine Rangliste, ersetzt keine Ausbildung und keine Unterweisung nach DGUV Vorschrift 49 § 8. */
const L_KEEP = '3 Jahren';    /* Löschfrist der Ergebnisse (Annahme, E-11 – rechtlich prüfen lassen) */
const mkey = d => d.getFullYear() + '-' + p2(d.getMonth() + 1);
const curM = () => mkey(today());
const mLab = k => { const [y, m] = k.split('-'); return MONL[+m - 1] + ' ' + y; };
const nextM = k => { const [y, m] = k.split('-').map(Number); return m === 12 ? (y + 1) + '-01' : y + '-' + p2(m + 1); };
const prevM = k => { const [y, m] = k.split('-').map(Number); return m === 1 ? (y - 1) + '-12' : y + '-' + p2(m - 1); };
const topic = id => S.topics.find(t => t.id === id);
/* Für Mitglieder sichtbar: veröffentlicht und der Monat hat begonnen */
const lVisible = () => S.topics.filter(t => t.st === 'aktiv' && t.m <= curM()).sort((a, b) => b.m.localeCompare(a.m));
const lActive = () => S.members.filter(m => !m.inv && m.akt !== false);
const myRes = (u, tid) => S.results.filter(r => r.u === u && r.tid === tid);
const lState = (u, tid) => { const rs = myRes(u, tid); return !rs.length ? 'offen' : rs.some(r => r.ok) ? 'ok' : 'nein'; };
const pct = (a, b) => b ? Math.round(a / b * 100) : 0;
const paras = x => String(x || '').split(/\n\s*\n/).map(s => s.trim()).filter(Boolean).map(s => `<p>${esc(s)}</p>`).join('');
const lTag = t => t.st === 'aus' ? '<span class="tag t-unw">Ausgeblendet</span>' : t.st === 'entwurf' ? '<span class="tag t-bma">Entwurf</span>' : t.m > curM() ? '<span class="tag t-thl">Geplant</span>' : '<span class="tag t-ok">Veröffentlicht</span>';
const stIcon = s => s === 'ok' ? '<span class="lst ok" title="bestanden">✓<span class="sr">bestanden</span></span>' : s === 'nein' ? '<span class="lst no" title="versucht, noch nicht bestanden">✗<span class="sr">noch nicht bestanden</span></span>' : '<span class="lst op" title="offen">–<span class="sr">offen</span></span>';
/* Symbole je Thema (E-23): eigene Zeichnungen, keine fremden Grafiken */
const SV = p => `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${p}</svg>`;
const LIC = {
  verkehr: ['Verkehr', '#F9ECE7', SV('<path d="M10 3h4l4 16H6z"/><path d="M8.5 9h7M7.3 14h9.4"/><path d="M4 21h16"/>')],
  herz: ['Erste Hilfe', '#FBEBEB', SV('<path d="M12 20s-7-4.4-7-10a4 4 0 0 1 7-2.6A4 4 0 0 1 19 10c0 5.6-7 10-7 10z"/><path d="M12 9v5M9.5 11.5h5"/>')],
  gefahr: ['Gefahren', '#F9EEDA', SV('<path d="M12 3 2 20h20z"/><path d="M12 10v4M12 17h.01"/>')],
  feuer: ['Brand', '#FBEBEB', SV('<path d="M12 21c-4 0-6-2.7-6-6 0-4 3-6 4-9 1.5 2 2 3 2 5 1-1 1.5-2 1.5-3 2.5 2 4.5 4.5 4.5 7 0 3.3-2 6-6 6z"/>')],
  funk: ['Funk', '#E7F1FB', SV('<rect x="7" y="8" width="10" height="13" rx="2"/><path d="M10 8V3M10 13h4M10 16h4"/>')],
  technik: ['Technik', '#F0EFEC', SV('<path d="M14.7 6.3a4 4 0 0 0-5.4 5.4L3 18v3h3l6.3-6.3a4 4 0 0 0 5.4-5.4l-2.5 2.5-2.5-2.5z"/>')],
  wasser: ['Wasser', '#E7F1FB', SV('<path d="M12 3s6 6.5 6 11a6 6 0 0 1-12 0c0-4.5 6-11 6-11z"/>')],
  atem: ['Atemschutz', '#EFEDFF', SV('<circle cx="12" cy="11" r="7"/><path d="M9 11h6M10 15h4"/>')],
  buch: ['Allgemein', '#E5F4E4', SV('<path d="M4 19.5V5a2 2 0 0 1 2-2h14v16H6.5A2.5 2.5 0 0 0 4 21.5"/>')]
};
const lic = t => LIC[t && t.ic] || LIC.buch;
const lIcon = (t, big) => { const c = lic(t); return `<span class="lic${big ? ' big' : ''}" style="background:${c[1]}">${c[2]}</span>`; };
/* Lesezeit (E-23): etwa 150 Wörter pro Minute plus 2 Minuten für die Fragen */
const lMin = t => { const w = [t.intro, ...t.secs.map(s => s.h + ' ' + s.x), ...t.keys].join(' ').split(/\s+/).filter(Boolean).length; return Math.max(3, Math.round(w / 150) + 2); };
/* Seiten eines Themas (E-17): Start, je Abschnitt eine Seite, „Das Wichtigste“, dann der Test */
const lPages = t => ['intro', ...t.secs.map((s, i) => i), 'keys', 'quiz'];
const lQuizAt = t => lPages(t).length - 1;
/* Serie (E-20): Monate in Folge bestanden, vom neuesten Thema rückwärts – sieht nur die Person selbst */
const lStreak = u => { const v = lVisible(); let i = v[0] && v[0].m === curM() && lState(u, v[0].id) !== 'ok' ? 1 : 0, n = 0; for (; i < v.length && lState(u, v[i].id) === 'ok'; i++) n++; return n; };
const lk = tid => S.user.name + '|' + tid;
/* Bild je Abschnitt (E-29): eigene Skizze oder eigenes Foto mit Bildbeschreibung */
const lAlt = s => s.alt || SKETCH_ALT[s.img] || '';
const lFig = s => s.img && IMG[s.img] ? `<figure class="lfig"><img src="${IMG[s.img]}" alt="${esc(lAlt(s))}"></figure>` : '';
const lCover = t => (t.secs.find(s => s.img && IMG[s.img]) || null);
const lNote = `<details class="help" id="l-info"><summary>Gut zu wissen: Wer sieht meine Ergebnisse?</summary><ul>
  <li>Mitmachen ist freiwillig und ergänzt die Übungsabende.</li>
  <li>Du siehst nur deine eigenen Ergebnisse. Den Lernstand aller sehen nur die Kommandanten – keine Admins, keine Redaktion, niemand öffentlich.</li>
  <li>Es gibt keine Rangliste. Die Ergebnisse dienen dazu, Übungen gut zu planen.</li>
  <li>Ergebnisse werden nach ${L_KEEP} gelöscht, beim Austritt sofort.</li>
  <li>Das Lernen hier ersetzt keine Ausbildung, keine Übung und keine Unterweisung. Im Einsatz gilt, was deine Führungskraft anordnet.</li></ul></details>`;
const lMiss = () => [curM(), nextM(curM())].filter(m => !S.topics.some(t => t.m === m && t.st === 'aktiv'));

/* Startseite „Lernen“ (E-16, E-20 bis E-22) */
V.lernen = () => {
  const vis = lVisible(), cur = vis[0], me = S.user.name, first = me.split(' ')[0];
  const done = vis.filter(t => lState(me, t.id) === 'ok').length, open = vis.slice(1).filter(t => lState(me, t.id) !== 'ok');
  let hero = '<div class="stat" id="l-cur">Noch kein Thema veröffentlicht. Schau nächsten Monat wieder vorbei.</div>', sub = 'Schön, dass du da bist.';
  if (cur) {
    const st = lState(me, cur.id), pg = S.lprog[lk(cur.id)] || 0, n = lQuizAt(cur) + cur.qs.length, mon = MONL[+cur.m.split('-')[1] - 1];
    const lab = cur.m === curM() ? 'Dein Thema im ' + mon : 'Aktuelles Thema (aus ' + mLab(cur.m) + ')';
    sub = st === 'ok' ? `Stark – dein Thema für ${mon} hast du geschafft.` : pg ? 'Du bist mittendrin – mach einfach da weiter, wo du aufgehört hast.' : `Dein Thema für ${mon} wartet auf dich. Dauert nur etwa ${lMin(cur)} Minuten.`;
    hero = `<div class="lhero${st === 'ok' ? ' done' : ''}" id="l-cur">${lIcon(cur, true)}<div class="stack" style="gap:6px;min-width:0">
      <span class="lkick">${esc(lab)}</span><h2>${esc(cur.t)}</h2><p>${esc(cur.intro)}</p>
      <span class="lmeta"><span>⏱ ca. ${lMin(cur)} Min.</span><span>${cur.qs.length} Fragen</span>${lic(cur)[0] !== 'Allgemein' ? `<span>${esc(lic(cur)[0])}</span>` : ''}</span>
      <span id="l-curst" class="lcst">${st === 'ok' ? '<b>✓ Geschafft</b>' : st === 'nein' ? '<b>Knapp – probier es nochmal</b>' : pg ? `<b>Weiter bei Schritt ${pg} von ${n - 1}</b>` : '<b>Noch offen</b>'}</span>
      ${pg && st !== 'ok' ? `<span class="lbar" aria-hidden="true"><i style="width:${pct(pg, n)}%"></i></span>` : ''}
      <div class="row2"><button class="btn wb" data-act="l-open" data-skip="1" data-id="${cur.id}">${st === 'ok' ? 'Nochmal ansehen' : pg ? 'Weiterlernen' : 'Los geht’s'}</button>${st !== 'ok' && cur.qs.length ? `<button class="btn o sm lquick" data-act="l-quiz" data-id="${cur.id}">Kenn ich schon – direkt zum Test</button>` : ''}</div></div></div>`;
  }
  const streak = lStreak(me), act = lActive(), okN = cur ? act.filter(m => lState(m.n, cur.id) === 'ok').length : 0;
  const card = t => `<button class="lcard" data-act="l-open" data-id="${t.id}">${lIcon(t)}<span class="stack" style="gap:2px;min-width:0;flex:1;text-align:left"><span class="mini">${mLab(t.m)}</span><b>${esc(t.t)}</b></span>${stIcon(lState(me, t.id))}</button>`;
  const kdt = isKdt() ? (() => { const miss = lMiss(); return `<div class="card lkdt" id="l-kdt"><b>Für Kommandanten</b>
      ${miss.length ? `<div class="stat warnbox" id="l-miss" style="font-size:15px;padding:12px"><b>Für ${miss.map(mLab).join(' und ')} ist noch kein Thema veröffentlicht.</b> Leg es im Themenplan an – es erscheint am Monatsersten von selbst.</div>` : ''}
      <div class="row2"><a class="btn sm" href="#lplan" id="to-lplan">Themenplan</a><a class="btn o sm" href="#lernstand" style="color:var(--ink)">Lernstand</a></div></div>`; })() : '';
  return sec(`<h1 style="font-size:40px" id="l-hi">Servus, ${esc(first)}!</h1>
    <p class="lead" id="l-sub">${esc(sub)}</p>
    ${hero}
    ${kdt}
    <div class="lstats">
      <div class="stat" id="l-mine"><span class="sr">Dein Lernstand: </span><span class="lnum">${done}<small> von ${vis.length}</small></span><span>Themen geschafft</span>
        <span class="lbar" aria-hidden="true"><i style="width:${pct(done, vis.length)}%"></i></span></div>
      <div class="stat" id="l-streak">${streak >= 2 ? `<span class="lnum">${streak}</span><span>Monate in Folge dabei – weiter so!</span>` : `<span class="lnum">${streak}</span><span>${streak === 1 ? 'Monat geschafft – nächsten Monat wird’s eine Serie.' : 'Starte deine Serie mit dem Thema des Monats.'}</span>`}</div>
    </div>
    ${cur && okN ? `<div class="stat" id="l-team" style="font-size:15px"><b>Gemeinsam:</b> ${okN} von ${act.length} aus der Einsatzabteilung haben das ${MONL[+cur.m.split('-')[1] - 1]}-Thema schon geschafft.</div>` : ''}
    ${vis.length > 1 ? `<h2 style="font-size:26px;margin-bottom:0">${open.length ? 'Zum Nachholen' : 'Frühere Themen'}</h2>${open.length ? `<span class="mini">${open.length === 1 ? 'Ein Thema ist' : open.length + ' Themen sind'} noch offen – jedes dauert nur ein paar Minuten.</span>` : ''}
      <div class="lgrid" id="l-arch">${open.concat(vis.slice(1).filter(t => lState(me, t.id) === 'ok')).map(card).join('')}</div>` : ''}
    ${lNote}
    <p class="mini">Mehr Lernstoff der Staatlichen Feuerwehrschulen: <a href="https://www.feuerwehr-lernbar.bayern/" target="_blank" rel="noopener">Feuerwehr-Lernbar Bayern</a> (externe Seite).</p>`);
};

/* Thema in Schritten (E-17) mit Test, eine Frage pro Bildschirm (E-18) und Ergebnis (E-19) */
V.thema = () => {
  const t = topic(S.lt);
  if (!t || (!isKdt() && !(t.st === 'aktiv' && t.m <= curM()))) return sec('<h1>Thema nicht gefunden</h1><a class="btn o" href="#lernen" style="color:var(--ink);align-self:flex-start">← Zu „Lernen“</a>');
  const prev = t.st !== 'aktiv' || t.m > curM(), me = S.user.name, P = lPages(t), qa = lQuizAt(t), N = qa - 1 + Math.max(t.qs.length, 1);
  const res = S.qres && S.qres.tid === t.id ? S.qres : null;
  let step = res ? qa : Math.min(S.lprog[lk(t.id)] || 0, qa); if (!t.qs.length && step === qa) step = qa - 1;
  const page = P[step];
  if (page === 'quiz' && !res && (!S.quiz || S.quiz.tid !== t.id)) S.quiz = {tid:t.id, i:0, r:[], fb:false};
  const pos = page === 'quiz' ? (res ? N : qa + S.quiz.i) : step;
  const nav = (next, label) => `<div class="lnav">${step > 0 ? '<button class="btn o" data-act="l-back" style="color:var(--ink)">Zurück</button>' : '<span></span>'}<button class="btn" data-act="l-next">${label || next}</button></div>`;
  const top = `<div class="ltopbar"><a class="btn o sm" href="#lernen" style="color:var(--ink)">← Lernen</a><span class="mini" id="l-pos">${res ? 'Fertig' : page === 'intro' ? 'Überblick' : 'Schritt ' + pos + ' von ' + N}</span></div>
    <span class="lbar big" id="l-prog" role="progressbar" aria-label="Fortschritt" aria-valuemin="0" aria-valuemax="${N}" aria-valuenow="${pos}"><i style="width:${pct(pos, N)}%"></i></span>`;
  let body = '';
  if (page === 'intro') {
    const rs = myRes(me, t.id);
    body = `${t.bsp ? '<div class="stat warnbox" style="font-size:15px" id="l-bsp"><b>Beispielinhalt für die Demo.</b> Vor dem echten Einsatz prüft der Kommandant den Inhalt fachlich und gleicht ihn mit dem aktuellen Stand der Quellen ab.</div>' : ''}

    ${lCover(t) ? `<figure class="lfig lcover">${`<img src="${IMG[lCover(t).img]}" alt="${esc(lAlt(lCover(t)))}">`}</figure>` : ''}<div class="lintro">${lIcon(t, true)}<span class="lkick">Thema ${mLab(t.m)}</span><h1 style="font-size:36px">${esc(t.t)}</h1><p class="lead">${esc(t.intro)}</p>
      <span class="lmeta"><span>⏱ ca. ${lMin(t)} Min.</span><span>${t.secs.length + 1} kurze Seiten</span><span>${t.qs.length} Fragen</span></span></div>

  } else if (page === 'keys') {
    body = `<article class="lpage"><h1 class="lkick">${esc(t.t)}</h1><h2 style="font-size:28px">Das Wichtigste</h2>

      ${t.links.length ? `<div class="stack" id="l-links" style="gap:4px"><b>Mehr dazu (externe Seiten)</b>${t.links.filter(l => SAFE_URL.test(l.u)).map(l => `<a href="${esc(l.u)}" target="_blank" rel="noopener" class="xl">${esc(l.l)} ↗</a>`).join('')}</div>` : ''}
      <p class="mini" id="l-src"><b>Quelle:</b> ${esc(t.src || '[Quelle angeben]')}${t.chk ? ' · Fachlich geprüft: ' + esc(t.chk.by) : ''}</p>
      <div class="tip" style="background:#E8EEF7" id="l-safe"><span style="font-size:15px"><b>Sicherheit geht vor:</b> Diese Lerneinheit ersetzt keine Ausbildung, keine Übung und keine Unterweisung. Im Einsatz gilt, was deine Führungskraft anordnet.</span></div></article>

      <details class="help"${res.ok ? '' : ' open'}><summary>Deine Antworten ansehen</summary><ol class="qrev">${t.qs.map((q, i) => { const ok = res.r[i] === q.c; return `<li class="${ok ? 'qok' : 'qno'}"><b>${esc(q.q)}</b><span>${ok ? '✓ Richtig' : '✗ Deine Antwort: ' + esc(q.o[res.r[i]] || '–')}</span>${ok ? '' : `<span>Richtig ist: <b>${esc(q.o[q.c])}</b></span>`}${q.x ? `<span class="mini">${esc(q.x)}</span>` : ''}</li>`; }).join('')}</ol></details>

      <fieldset class="qz" ${fb ? 'disabled' : ''}><legend>${esc(q.q)}</legend>${q.o.map((o, j) => o ? `<label class="opt${fb && j === q.c ? ' right' : ''}${fb && j === a && !right ? ' wrong' : ''}"><input type="radio" name="q" value="${j}"${a === j ? ' checked' : ''}><span>${esc(o)}</span></label>` : '').join('')}</fieldset>

        <button class="btn" type="button" data-act="q-next" id="q-next">${Q.i + 1 < t.qs.length ? 'Nächste Frage' : 'Ergebnis ansehen'}</button>`

  return sec(top + body, 'lflow');
};

const blankQ = () => ({q:'', o:['', '', '', ''], c:0, x:''});
const ltNew = m => { if (!m) { m = curM(); while (S.topics.some(t => t.m === m && t.st === 'aktiv')) m = nextM(m); }
  return {id:null, t:'', m, ic:'buch', intro:'', secs:[{h:'', x:''}], keys:'', links:[{l:'', u:''}], qs:Array.from({length:L_Q}, blankQ), src:'', mail:true, chk:false}; };
const ltCopy = t => ({...JSON.parse(JSON.stringify(t)), ic:t.ic || 'buch', keys:t.keys.join('\n'), links:t.links.length ? JSON.parse(JSON.stringify(t.links)) : [{l:'', u:''}], qs:t.qs.map(q => ({...q, o:q.o.concat(['', '', '', '']).slice(0, 4)})).concat(Array.from({length:L_Q}, blankQ)).slice(0, L_Q), chk:false, mail:t.mail !== false});
function ltRead(fm) { const d = S.ted, v = n => (fm.elements[n] ? fm.elements[n].value : '').trim();
  d.t = v('t'); d.m = v('m'); d.intro = v('intro'); d.src = v('src'); d.keys = fm.elements.keys.value; d.chk = fm.elements.chk.checked; d.mail = fm.elements.mail.checked;
  d.ic = (fm.querySelector('input[name="ic"]:checked') || {}).value || d.ic || 'buch';
  d.secs = d.secs.map((s, i) => ({h:v('sh' + i), x:fm.elements['sx' + i].value, img:s.img, alt:fm.elements['sa' + i] ? v('sa' + i) : s.alt}));

  d.qs = d.qs.map((q, i) => ({q:v('qq' + i), o:[0, 1, 2, 3].map(j => v('qo' + i + '_' + j)), c:+((fm.querySelector(`input[name="qc${i}"]:checked`) || {}).value || 0), x:v('qx' + i)})); }
/* „Was fehlt noch?“ – alle Lücken auf einmal nennen (E-27) */
function ltMissing(d) { const m = [];
  if (!d.intro) m.push('Einleitung');
  if (!d.secs.some(s => s.x.trim())) m.push('Text in einem Abschnitt');
  const eq = d.qs.map((q, i) => q.q ? 0 : i + 1).filter(Boolean); if (eq.length) m.push('Frage ' + eq.join(', '));
  d.qs.forEach((q, i) => { if (q.q && q.o.filter(Boolean).length < 2) m.push(`mindestens 2 Antworten bei Frage ${i + 1}`); else if (q.q && !q.o[q.c]) m.push(`richtige Antwort bei Frage ${i + 1} markieren`); });
  d.secs.forEach((s, i) => { if (s.img && !(s.alt || '').trim()) m.push(`Bildbeschreibung zu Abschnitt ${i + 1}`); });
  if (!d.src) m.push('Quelle mit Stand');
  return m; }
function ltCheck(d, pub) {
  if (!d.t) return 'Bitte gib einen Titel ein.';
  if (!/^\d{4}-\d{2}$/.test(d.m)) return 'Bitte wähle den Monat.';
  if (d.links.some(l => l.u && !/^https:\/\/[^\s]+$/.test(l.u))) return 'Links müssen mit https:// beginnen.';
  if (!pub) return '';
  const m = ltMissing(d); if (m.length) return 'Zum Veröffentlichen fehlt noch: ' + m.join(' · ') + '.';
  const dup = S.topics.find(t => t.m === d.m && t.st === 'aktiv' && t.id !== d.id);
  if (dup) return `Für ${mLab(d.m)} gibt es schon ein Thema: „${dup.t}“. Blende es erst aus oder wähle einen anderen Monat.`;
  if (!d.chk) return 'Bitte bestätige, dass du den Inhalt fachlich geprüft hast.';
  return ''; }

        <div class="f">Bild oder Skizze (optional)<div class="thumbs">${s.img && IMG[s.img] ? `<span class="th"><img src="${IMG[s.img]}" alt="Bild zu Abschnitt ${i + 1}"><button type="button" class="ib sm" data-act="lt-img-rm" data-i="${i}" aria-label="Bild entfernen">×</button></span>` : ''}</div>

/* Themenplan – nur Kommandanten (E-26): 12 Monate auf einen Blick */
V.lplan = () => {
  const start = prevM(prevM(curM())), months = [];
  let m = start; for (let i = 0; i < 12; i++) { months.push(m); m = nextM(m); }
  const older = S.topics.filter(t => t.m < start).sort((a, b) => b.m.localeCompare(a.m)), miss = lMiss();
  const tcard = t => `<div class="card lpc" data-tid="${t.id}"><div class="lpch">${lIcon(t)}<span class="stack" style="gap:4px;min-width:0;flex:1"><b>${esc(t.t || '[ohne Titel]')}</b><span>${lTag(t)}</span><span class="mini">${t.qs.length} Fragen · ${new Set(S.results.filter(r => r.tid === t.id).map(r => r.u)).size} haben teilgenommen</span></span></div>
    <div class="row2"><button class="btn o sm" data-act="lt-edit" data-id="${t.id}" style="color:var(--ink)">Bearbeiten</button><button class="btn o sm" data-act="l-open" data-id="${t.id}" style="color:var(--ink)">Ansehen</button><button class="btn o sm" data-act="lt-copy" data-id="${t.id}" style="color:var(--ink)">Kopieren</button>${t.st === 'aus' ? `<button class="btn o sm" data-act="lt-show" data-id="${t.id}" style="color:var(--ink)">Einblenden</button>` : t.st === 'aktiv' ? `<button class="btn o sm" data-act="lt-hide" data-id="${t.id}" style="color:var(--ink)">Ausblenden</button>` : ''}</div></div>`;

      return `<section class="lpm${k === curM() ? ' now' : ''}" id="lpm-${k}"><h2>${mLab(k)}${k === curM() ? ' <span class="tag t-ok">jetzt</span>' : ''}</h2>
        ${ts.length ? ts.map(tcard).join('') : `<div class="lpempty"><span>Noch kein Thema</span><button class="btn o sm" data-act="lt-new" data-m="${k}" style="color:var(--ink)">+ Thema für ${MONL[+k.split('-')[1] - 1]}</button></div>`}</section>`; }).join('')}</div>
    ${older.length ? `<details class="help"><summary>Ältere Themen (${older.length})</summary><div class="stack" style="margin-top:10px">${older.map(tcard).join('')}</div></details>` : ''}

/* Lernstand – nur Kommandanten (E-08 bis E-10) */
V.lernstand = () => {
  const vis = lVisible(), act = lActive();
  if (!S.lsel || !vis.some(t => t.id === S.lsel)) S.lsel = vis[0] && vis[0].id;
  const t = topic(S.lsel), n = act.length;
  const stats = x => { const us = act.filter(m => myRes(m.n, x.id).length); const ok = act.filter(m => lState(m.n, x.id) === 'ok');
    const first = us.map(m => myRes(m.n, x.id)[0]); return {us, ok, avg: first.length ? Math.round(first.reduce((s, r) => s + pct(r.sc, r.n), 0) / first.length) : 0, first}; };
  if (!t) return sec('<h1 style="font-size:40px">Lernstand</h1><div class="stat">Noch kein Thema veröffentlicht.</div>');
  const s = stats(t), hard = t.qs.map((q, i) => [q.q, s.first.filter(r => r.r[i] !== q.c).length]).map(([q, w], i) => [i, q, pct(w, s.first.length)]).sort((a, b) => b[2] - a[2]);
  const cols = vis.slice(0, 4).reverse();
